services:
  database:
    image: postgres:13
    container_name: conduit-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
  backend:
    build: ./backend/conduit-backend
    container_name: conduit-backend
    restart: unless-stopped
    # Backend should only start up when the database is up and running
    depends_on:
      database:
        condition: service_healthy
    environment:
      DB_ENGINE: ${DB_ENGINE}
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DJANGO_DEBUG: ${DJANGO_DEBUG}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS}
      CORS_ORIGIN_WHITELIST: ${CORS_ORIGIN_WHITELIST}

    ports:
      - "${BACKEND_PORT}:8000"
    volumes:
      - static_volume:/app/staticfiles
  frontend:
    build: ./frontend/conduit-frontend
    container_name: conduit-frontend
    restart: unless-stopped
    # Frontend should only run whn backend is up and running
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT}:80"
    volumes:
      - static_volume:/usr/share/nginx/html/static

volumes:
  db-data:
  static_volume: